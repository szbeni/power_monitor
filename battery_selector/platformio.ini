; ESP32 battery selector — 4 relays via MQTT select
[platformio]
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
  -std=c++17
  -std=gnu++17
  -Wall -Wextra
  -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_WARN

build_unflags =
  -std=gnu++11

lib_deps =
  knolleary/PubSubClient @ ^2.8
  bblanchon/ArduinoJson @ ^7.4.3

platform = espressif32

[env:esp32dev]
board = esp32dev
board_build.partitions = default.csv
; Uncomment if needed:
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0

; LAN OTA upload (ArduinoOTA). Password must match OTA_PASSWORD in secrets.h.
;   pio run -e esp32-ota -t upload --upload-port 192.168.x.x
; or: ./setup_and_build.sh --ota 192.168.x.x
[env:esp32-ota]
extends = env:esp32dev
upload_protocol = espota
upload_flags =
  --auth=ota_change_me
; Override auth if you changed OTA_PASSWORD:
;   upload_flags = --auth=your_password
