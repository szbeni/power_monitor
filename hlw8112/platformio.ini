; ESP32-C3 SuperMini + HLW8112 energy meter (SPI) -> MQTT / Home Assistant

[platformio]
default_envs = esp32c3-supermini

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_unflags =
  -std=gnu++11

build_flags =
  -std=gnu++17
  -Wall -Wextra
  ; ESP-IDF headers trip this constantly and bury real diagnostics
  -Wno-missing-field-initializers
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_WARN

lib_deps =
  knolleary/PubSubClient @ ^2.8

[env:esp32c3-supermini]
upload_speed = 921600

[env:esp32c3-ota]
upload_protocol = espota
upload_port = hlw8112-meter.local
