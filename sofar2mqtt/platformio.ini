; Standalone Sofar2mqtt (upstream sketch) — ESP8266 NodeMCU + Sofar RS485
; Source: ~/repos/Sofar2mqtt (Colin McGerty et al.)
[platformio]
default_envs = nodemcuv2
src_dir = Sofar2mqtt

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 9600
upload_speed = 921600

build_flags =
  -D INVERTER_HYBRID
  ; -D INVERTER_ME3000
  -I include

lib_deps =
  knolleary/PubSubClient
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SSD1306

; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0
