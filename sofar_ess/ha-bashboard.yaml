          - entity: sensor.tasmotatempsensoroutside_bme280_humidity
            name: Outside
          - entity: sensor.tasmotatempsensoroutside_bme280_temperature
            name: Outside
          - entity: sensor.tasmotatempsensorbedroom_bme280_temperature
            name: Master bedroom
          - entity: sensor.tasmotatempsensorbedroom_bme280_humidity
            name: Master bedroom
          - entity: binary_sensor.trv_bedroom_rear_heating_sonoff
            name: Amelie bedroom
          - entity: binary_sensor.trv_bedroom_front_heating_sonoff
