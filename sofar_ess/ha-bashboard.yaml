            icon: mdi:fire
          - entity: sensor.diesel_heater_state
            icon: mdi:state-machine
          - entity: sensor.diesel_heater_vent
            icon: mdi:fan
          - entity: number.diesel_heater_intensity
        title: Diesel Heater
      - type: thermostat
        entity: climate.trv_livingroom_sonoff
        name: Living room temperature
      - type: thermostat
        entity: climate.trv_masterbedroom_sonoff
        name: Master Bedroom Temperature
      - type: thermostat
        entity: climate.trv_bedroom_rear_sonoff
        name: "Amelie bedroom "
      - type: thermostat
        entity: climate.trv_conservatory_sonoff
        name: Conservatory Radiator
      - type: thermostat
        entity: climate.trv_bedroom_front_sonoff
        name: Bedroom Front Radiator
      - type: thermostat
        entity: climate.trv_bathroom_sonoff
        name: Bathroom Radiator
      - type: thermostat
        entity: climate.trv_kitchen_sonoff
        name: Kitchen Radiator
      - type: custom:scheduler-card
        include:
          - climate
      - type: entities
        entities:
          - entity: switch.boilercontroller_tasmota
            icon: mdi:water-boiler
            name: Boiler State
          - entity: binary_sensor.trv_livingroom_heating_sonoff
          - entity: binary_sensor.trv_masterbedroom_heating_sonoff
          - entity: binary_sensor.trv_conservatory_heating
          - entity: binary_sensor.trv_bathroom_heating
          - entity: binary_sensor.trv_bedroom_front_heating_sonoff
          - entity: binary_sensor.trv_bedroom_rear_heating_sonoff
      - type: weather-forecast
        entity: weather.caravan
        show_forecast: false
      - show_name: true
        show_icon: true
        type: button
        entity: switch.piv_fan
        icon: mdi:fan
      - type: grid
        square: false
        columns: 1
        cards:
          - type: thermostat
            entity: climate.aircon_master_bedroom
            features:
              - type: climate-hvac-modes
                hvac_modes:
                  - "off"
                  - cool
                  - heat
                  - dry
                  - fan_only
                  - heat_cool
          - type: thermostat
            entity: climate.aircon_amelie_bedroom
            features:
              - type: climate-hvac-modes
                hvac_modes:
                  - "off"
                  - cool
                  - heat
                  - dry
                  - fan_only
                  - heat_cool
          - type: thermostat
            entity: climate.aircon_bedroom_front
            features:
              - type: climate-hvac-modes
                hvac_modes:
                  - "off"
                  - cool
                  - heat
                  - dry
                  - fan_only
                  - heat_cool
