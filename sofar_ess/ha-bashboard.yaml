                  action: navigate
                  navigation_path: /home-mobile-view/heating
                style:
                  color: transparent
                  top: 88%
                  left: 75%
                  font-size: 17px
                  transform: translate(-50%,-50%) scale(0.7,0.7)
              - type: state-badge
                title: ""
                entity: sensor.trv_bedroom_rear_temperature
