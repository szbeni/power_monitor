                  action: navigate
                  navigation_path: /home-mobile-view/heating
                style:
                  color: transparent
                  top: 35%
                  left: 18%
                  font-size: 17px
                  transform: translate(-50%,-50%) scale(0.7,0.7)
              - type: state-badge
                title: ""
                entity: sensor.trv_bathroom_temperature
                tap_action:
                  action: navigate
                  navigation_path: /home-mobile-view/heating
                style:
                  color: transparent
                  top: 76%
                  left: 20%
                  font-size: 17px
