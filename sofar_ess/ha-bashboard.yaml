                  action: toggle
                hold_action:
                  action: more-info
                style:
                  top: 90%
                  left: 40%
                  "--iron-icon-height": 42px
                  "--iron-icon-width": 42px
              - type: icon
                title: Living room camera
                icon: mdi:cctv
                entity: camera.tapocamera_sd
                tap_action:
                  action: navigate
                  navigation_path: /home-mobile-view/cameras
                style:
                  top: 98%
                  left: 18%
                  "--iron-icon-fill-color": "#11AB7D"
                  "--iron-icon-height": 40px
                  "--iron-icon-width": 40px
          - type: picture-elements
            image: local/floorplan/hendravean/first_floor.png
            elements:
              - type: state-icon
                entity: light.light_masterbedroom
                title: Master Bedroom Light
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                style:
                  top: 25%
                  left: 33%
                  "--iron-icon-height": 42px
                  "--iron-icon-width": 42px
              - type: state-badge
                title: ""
                entity: sensor.trv_master_bedroom_temperature
