                  action: navigate
                  navigation_path: /home-mobile-view/heating
                style:
                  color: transparent
                  top: 24%
                  left: 75%
                  font-size: 17px
                  transform: translate(-50%,-50%) scale(0.7,0.7)
              - type: state-icon
                entity: light.light_amelie_bedroom
                title: Bedroom Rear Light
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                style:
                  top: 28%
                  left: 75%
                  "--iron-icon-height": 42px
                  "--iron-icon-width": 42px
              - type: state-icon
                entity: light.light_stairs
                title: Light Stairs
                icon: mdi:ceiling-light
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                style:
                  top: 76%
                  left: 40%
                  "--iron-icon-height": 42px
                  "--iron-icon-width": 42px
