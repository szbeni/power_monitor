title: Home Mobile View
views:
  - title: Floorplan
    path: floorplan
    panel: true
    theme: ""
    badges: []
    cards:
      - type: vertical-stack
        cards:
          - type: picture-elements
            image: local/floorplan/hendravean/ground_floor.png
            elements:
              - type: state-badge
                title: ""
                entity: sensor.trv_conservatory_temperature
                tap_action:
                  action: navigate
                  navigation_path: /home-mobile-view/heating
                style:
                  color: transparent
                  top: 17%
                  left: 73%
                  font-size: 17px
                  transform: translate(-50%,-50%) scale(0.7,0.7)
              - type: state-badge
                title: ""
                entity: sensor.trv_kitchen_temperature
                tap_action:
                  action: navigate
                  navigation_path: /home-mobile-view/heating
                style:
                  color: transparent
                  top: 66%
                  left: 25%
                  font-size: 17px
                  transform: translate(-50%,-50%) scale(0.7,0.7)
              - type: state-icon
                entity: light.dmmerswitchlivingroom
                title: Living room light
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                style:
                  top: 65%
                  left: 73%
                  "--iron-icon-height": 42px
                  "--iron-icon-width": 42px
              - type: state-icon
                entity: light.light_livingroom
                title: Living room light
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                style:
                  top: 80%
                  left: 73%
                  "--iron-icon-height": 42px
                  "--iron-icon-width": 42px
              - type: state-badge
                title: ""
                entity: sensor.tasmotatempsensorlivingroom_bme280_temperature
                tap_action:
                  action: navigate
                  navigation_path: /home-mobile-view/heating
                style:
                  color: transparent
                  top: 48%
                  left: 73%
                  font-size: 17px
                  transform: translate(-50%,-50%) scale(0.7,0.7)
              - type: state-icon
                entity: switch.light_switch_kitchen
                icon: mdi:ceiling-light
                title: Kitchen Light
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                style:
                  top: 65%
                  left: 38%
                  "--iron-icon-height": 42px
                  "--iron-icon-width": 42px
              - type: state-icon
                entity: switch.light_switch_dual_hall_stairs_left
                icon: mdi:ceiling-light
                title: Hall Light
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                style:
                  top: 81%
                  left: 15%
                  "--iron-icon-height": 42px
                  "--iron-icon-width": 42px
              - type: state-icon
                entity: light.light_stairs
