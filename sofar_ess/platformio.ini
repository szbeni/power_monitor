; ESP8266 NodeMCU: Sofar RS485 + JSY-MK-194G load2 + ESS active-power loop
; Combines Sofar2mqtt control with JSY grid metering on one NodeMCU.
[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
  -std=c++17
  -D INVERTER_HYBRID
  ; -D INVERTER_ME3000

lib_deps =
  knolleary/PubSubClient @ ^2.8

; Uncomment if needed:
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0
