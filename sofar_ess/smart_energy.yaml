# Sofar ESS — smart overnight charging (Home Assistant package)
#
# Install:
#   1. In configuration.yaml enable packages, e.g.:
#        homeassistant:
#          packages: !include_dir_named packages
#   2. Copy this file to config/packages/smart_energy.yaml
#   3. Developer Tools → YAML → Check configuration → Restart HA
#   4. Confirm Forecast.Solar entities exist
#   5. Leave Automation enabled OFF, run "Recalculate / apply now" once to dry-run
#   6. Enable Automation when the Decision / Target look sensible
#
# Cheap window: 00:30–05:30 @ 9.5p/kWh; rest of day full ESS (33.42p).
# Charge uses sofaress/set/charge + set/charge_target_soc; firmware stops at target → standby.
# After midnight the day-ahead solar sensor is energy_production_today
# (energy_production_tomorrow is the following day — used for evening preview).
#
# Edit FORECAST entities below if your Forecast.Solar IDs differ.

input_boolean:
  smart_charge_enabled:
    name: Smart overnight charge
    icon: mdi:battery-charging-wireless
    # Stay off until dry-run looks correct
  smart_charge_session_active:
    name: Smart charge session active
    icon: mdi:timer-sand

input_number:
  smart_charge_min_soc:
    name: Smart charge min SOC
    min: 5
    max: 50
    step: 1
    unit_of_measurement: "%"
    icon: mdi:battery-20
    initial: 20
    mode: box
  smart_charge_max_soc:
    name: Smart charge max overnight SOC
    min: 40
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:battery-80
    initial: 80
    mode: box
  smart_charge_battery_kwh:
    name: Smart charge battery capacity
    min: 1
    max: 40
    step: 0.1
    unit_of_measurement: kWh
    icon: mdi:battery
    initial: 15
    mode: box
  smart_charge_power_w:
    name: Smart charge power
    min: 200
    max: 3600
    step: 50
    unit_of_measurement: W
    icon: mdi:flash
    initial: 2500
    mode: box
  smart_charge_learned_demand_kwh:
    name: Smart charge daily demand
    min: 1
    max: 80
    step: 0.1
    unit_of_measurement: kWh
    icon: mdi:home-lightning-bolt
    initial: 12
    mode: box
  smart_charge_forecast_correction:
    name: Smart charge forecast correction
    min: 0.5
    max: 1.5
    step: 0.01
    icon: mdi:chart-line
    initial: 1.0
    mode: box
  smart_charge_locked_target_soc:
    name: Smart charge locked overnight target
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:target
    initial: 20
    mode: box
  smart_charge_saved_day_forecast:
    name: Smart charge saved day forecast
    min: 0
    max: 100
    step: 0.01
    unit_of_measurement: kWh
    icon: mdi:weather-sunny
    initial: 0
    mode: box

input_text:
  smart_charge_status:
    name: Smart charge status
    max: 80
    initial: idle
    icon: mdi:information-outline
  smart_charge_decision_reason:
    name: Smart charge decision reason
    max: 255
    initial: "Waiting for first evaluation"
    icon: mdi:text

template:
  - sensor:
      - name: Smart Charge Status
        unique_id: smart_charge_status_sensor
        icon: mdi:information-outline
        state: "{{ states('input_text.smart_charge_status') }}"

      - name: Smart Charge Decision Reason
        unique_id: smart_charge_decision_reason_sensor
        icon: mdi:text
        state: "{{ states('input_text.smart_charge_decision_reason') }}"

      - name: Smart Charge Forecast Entity
        unique_id: smart_charge_forecast_entity
        icon: mdi:weather-partly-cloudy
        # After midnight prefer today (day ahead); evenings prefer tomorrow.
        # Fall back to the other Forecast.Solar sensor if one is missing.
        state: >-
          {% set today = 'sensor.energy_production_today' %}
          {% set tomorrow = 'sensor.energy_production_tomorrow' %}
          {% set primary = today if now().hour < 12 else tomorrow %}
          {% set secondary = tomorrow if primary == today else today %}
          {% if states(primary) not in ['unknown', 'unavailable', 'none', ''] %}
            {{ primary }}
          {% elif states(secondary) not in ['unknown', 'unavailable', 'none', ''] %}
            {{ secondary }}
          {% else %}
            {{ primary }}
          {% endif %}

      - name: Smart Charge Corrected Forecast
        unique_id: smart_charge_corrected_forecast
        unit_of_measurement: kWh
        device_class: energy
        icon: mdi:solar-power
        state: >-
          {% set ent = states('sensor.smart_charge_forecast_entity') %}
          {% set raw = states(ent) %}
          {% if raw in ['unknown', 'unavailable', 'none', ''] %}
            unavailable
          {% else %}
            {% set corr = states('input_number.smart_charge_forecast_correction') | float(1) %}
            {{ (raw | float(0) * corr) | round(2) }}
          {% endif %}

      - name: Smart Charge Battery SOC
        unique_id: smart_charge_battery_soc
        unit_of_measurement: "%"
        device_class: battery
        icon: mdi:battery-sync
        availability: >-
          {{ states('sensor.sofar_ess_battery_combined_soc')
             not in ['unknown', 'unavailable', 'none', ''] or
             states('sensor.sofar_ess_battery_soc')
             not in ['unknown', 'unavailable', 'none', ''] }}
        state: >-
          {% set combined = states('sensor.sofar_ess_battery_combined_soc') %}
          {% if combined not in ['unknown', 'unavailable', 'none', ''] %}
            {{ combined | float | round(1) }}
          {% else %}
            {{ states('sensor.sofar_ess_battery_soc') | float | round(1) }}
          {% endif %}
        attributes:
          source: >-
            {% set combined = states('sensor.sofar_ess_battery_combined_soc') %}
            {{ 'combined' if combined not in ['unknown', 'unavailable', 'none', '']
               else 'connected_fallback' }}

      - name: Site Solar Total Power
        unique_id: site_solar_total_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:solar-power
        state: >-
          {% set s1600 = states('sensor.opendtu_60d84c_ac_power') %}
          {% set s800 = states('sensor.home_pv_power') %}
          {% set sofar = states('sensor.sofar_ess_sofar_pv_total') %}
          {% set w1600 = s1600 | float(0) if s1600 not in ['unknown', 'unavailable', 'none', ''] else 0 %}
          {% set w800 = s800 | float(0) if s800 not in ['unknown', 'unavailable', 'none', ''] else 0 %}
          {% set wpv = sofar | float(0) if sofar not in ['unknown', 'unavailable', 'none', ''] else 0 %}
          {{ (w1600 + w800 + wpv) | round(0) }}
        attributes:
          hoymiles_1600_w: "{{ states('sensor.opendtu_60d84c_ac_power') }}"
          hoymiles_800_w: "{{ states('sensor.home_pv_power') }}"
          sofar_pv_w: "{{ states('sensor.sofar_ess_pv_total') }}"

      - name: Site Solar Today
        unique_id: site_solar_today_wh
        unit_of_measurement: Wh
        device_class: energy
        state_class: total_increasing
        icon: mdi:solar-power-variant
        state: >-
          {% set y1600 = states('sensor.opendtu_60d84c_yield_day') %}
          {% set y800 = states('sensor.home_today_s_energy') %}
          {% set ysofar = states('sensor.sofar_ess_sofar_pv_today') %}
          {% set k1600 = y1600 | float(0) if y1600 not in ['unknown', 'unavailable', 'none', ''] else 0 %}
          {% set k800 = y800 | float(0) if y800 not in ['unknown', 'unavailable', 'none', ''] else 0 %}
          {% set ksofar = ysofar | float(0) if ysofar not in ['unknown', 'unavailable', 'none', ''] else 0 %}
          {{ (k1600 + k800 + ksofar) | round(2) }}
        attributes:
          hoymiles_1600_kwh: "{{ states('sensor.opendtu_60d84c_yield_day') }}"
          hoymiles_800_kwh: "{{ states('sensor.home_today_s_energy') }}"
          sofar_pv_kwh: "{{ states('sensor.sofar_ess_pv_today') }}"

      - name: Smart Charge Target SOC
        unique_id: smart_charge_target_soc
        unit_of_measurement: "%"
        icon: mdi:battery-heart
        state: >-
          {% set ent = states('sensor.smart_charge_forecast_entity') %}
          {% set raw = states(ent) %}
          {% set min_soc = states('input_number.smart_charge_min_soc') | float(20) %}
          {% set max_soc = states('input_number.smart_charge_max_soc') | float(80) %}
          {% set demand = states('input_number.smart_charge_learned_demand_kwh') | float(12) %}
          {% set cap = states('input_number.smart_charge_battery_kwh') | float(10) %}
          {% set corr = states('input_number.smart_charge_forecast_correction') | float(1) %}
          {% if raw in ['unknown', 'unavailable', 'none', ''] or cap <= 0 %}
            {{ max_soc | int }}
          {% else %}
            {% set solar = raw | float(0) * corr %}
            {% set deficit = [0, demand - solar] | max %}
            {% set need = (deficit / cap) * 100 %}
            {% set target = [[need, min_soc] | max, max_soc] | min %}
            {{ target | round(0) | int }}
          {% endif %}
        attributes:
          forecast_entity: "{{ states('sensor.smart_charge_forecast_entity') }}"
          forecast_raw: >-
            {% set ent = states('sensor.smart_charge_forecast_entity') %}
            {{ states(ent) }}
          corrected_kwh: "{{ states('sensor.smart_charge_corrected_forecast') }}"
          demand_kwh: "{{ states('input_number.smart_charge_learned_demand_kwh') }}"
          fallback: >-
            {% set ent = states('sensor.smart_charge_forecast_entity') %}
            {% set raw = states(ent) %}
            {{ raw in ['unknown', 'unavailable', 'none', ''] }}

script:
  smart_charge_set_status:
    alias: Smart charge set status
    mode: queued
    fields:
      status:
        required: true
        selector:
          text:
      reason:
        required: true
        selector:
          text:
    sequence:
      - service: input_text.set_value
        target:
          entity_id: input_text.smart_charge_status
        data:
          value: "{{ status }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.smart_charge_decision_reason
        data:
          value: "{{ reason }}"

  smart_charge_command_charge:
    alias: Smart charge command charge
    mode: single
    sequence:
      # Stop at locked target — band [target, target+hyst] is standby (grid only).
      - service: mqtt.publish
        data:
          topic: sofaress/set/charge_target_soc
          payload: "{{ states('input_number.smart_charge_locked_target_soc') | int }}"
      - service: mqtt.publish
        data:
          topic: sofaress/set/charge
          payload: "{{ states('input_number.smart_charge_power_w') | int }}"
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.smart_charge_session_active

  smart_charge_command_standby:
    alias: Smart charge command standby
    mode: single
    sequence:
      - service: mqtt.publish
        data:
          topic: sofaress/set/charge_target_soc
          payload: "0"
      - service: mqtt.publish
        data:
          topic: sofaress/set/standby
          payload: "true"
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.smart_charge_session_active

  smart_charge_restore_full_ess:
    alias: Smart charge restore full ESS
    mode: single
    sequence:
      - service: mqtt.publish
        data:
          topic: sofaress/set/ess
          payload: "full"
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.smart_charge_session_active

  smart_charge_stop_and_restore_ess:
    alias: Smart charge stop and restore ESS
    mode: single
    icon: mdi:battery-off
    sequence:
      - service: script.smart_charge_restore_full_ess
      - service: script.smart_charge_set_status
        data:
          status: idle
          reason: "Manual stop — full ESS restored"

  smart_charge_evaluate_now:
    alias: Smart charge evaluate now
    mode: restart
    icon: mdi:calculator-variant
    sequence:
      - variables:
          soc_raw: "{{ states('sensor.smart_charge_battery_soc') }}"
          forecast_ent: "{{ states('sensor.smart_charge_forecast_entity') }}"
          forecast_raw: "{{ states(states('sensor.smart_charge_forecast_entity')) }}"
          target_live: "{{ states('sensor.smart_charge_target_soc') | int(80) }}"
          min_soc: "{{ states('input_number.smart_charge_min_soc') | float(20) }}"
          max_soc: "{{ states('input_number.smart_charge_max_soc') | float(80) }}"
          demand: "{{ states('input_number.smart_charge_learned_demand_kwh') | float(12) }}"
          corr: "{{ states('input_number.smart_charge_forecast_correction') | float(1) }}"
          fallback: "{{ states(states('sensor.smart_charge_forecast_entity')) in ['unknown', 'unavailable', 'none', ''] }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ soc_raw in ['unknown', 'unavailable', 'none', ''] }}"
            sequence:
              - service: script.smart_charge_command_standby
              - service: script.smart_charge_set_status
                data:
                  status: error
                  reason: "SOC unavailable — standby for safety"
        default:
          - variables:
              soc: "{{ soc_raw | float(0) }}"
              target: >-
                {% if fallback | bool %}
                  {{ max_soc | int }}
                {% else %}
                  {{ target_live | int }}
                {% endif %}
              reason: >-
                {% if fallback | bool %}
                  Forecast missing ({{ forecast_ent }}) — fallback to max {{ max_soc | int }}%
                {% else %}
                  {% set solar = (forecast_raw | float(0) * corr | float(1)) | round(2) %}
                  Forecast {{ forecast_raw }} kWh × {{ corr }} = {{ solar }} kWh vs demand {{ demand }} kWh → target {{ target }}%
                {% endif %}
          - service: input_number.set_value
            target:
              entity_id: input_number.smart_charge_locked_target_soc
            data:
              value: "{{ target }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ not is_state('input_boolean.smart_charge_enabled', 'on') }}"
                sequence:
                  - service: script.smart_charge_set_status
                    data:
                      status: dry-run
                      reason: "{{ reason }} (automation off — no inverter command)"
              - conditions:
                  - condition: or
                    conditions:
                      - condition: time
                        after: "00:30:00"
                        before: "05:30:00"
                sequence:
                  #   SOC < target              → force charge
                  #   target … target+hyst      → standby (grid only)
                  #   SOC > target + hyst       → full ESS
                  - variables:
                      hyst: 2
                      band: >-
                        {% set t = target | float %}
                        {% set s = soc | float %}
                        {% if s < t %}
                          charge
                        {% elif s > (t + hyst) %}
                          ess
                        {% else %}
                          standby
                        {% endif %}
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ band == 'charge' }}"
                        sequence:
                          - service: script.smart_charge_command_charge
                          - service: script.smart_charge_set_status
                            data:
                              status: charging
                              reason: "{{ reason }} | SOC {{ soc | round(0) }}% < {{ target }}% — charging"
                      - conditions:
                          - condition: template
                            value_template: "{{ band == 'ess' }}"
                        sequence:
                          - service: script.smart_charge_restore_full_ess
                          - service: script.smart_charge_set_status
                            data:
                              status: ess
                              reason: "{{ reason }} | SOC {{ soc | round(0) }}% > {{ (target | float + hyst) | int }}% — ESS"
                    default:
                      - service: script.smart_charge_command_standby
                      - service: script.smart_charge_set_status
                        data:
                          status: holding
                          reason: "{{ reason }} | SOC {{ soc | round(0) }}% in [{{ target }}%, {{ (target | float + hyst) | int }}%] — standby (grid)"
            default:
              - service: script.smart_charge_restore_full_ess
              - service: script.smart_charge_set_status
                data:
                  status: idle
                  reason: "Outside cheap window — full ESS active"

automation:
  - id: smart_charge_cheap_window_start
    alias: Smart charge cheap window start
    description: At 00:30 lock target from day-ahead forecast and charge or hold.
    mode: single
    trigger:
      - platform: time
        at: "00:30:00"
    condition:
      - condition: state
        entity_id: input_boolean.smart_charge_enabled
        state: "on"
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.smart_charge_saved_day_forecast
        data:
          value: >-
            {% set t = states('sensor.energy_production_today') %}
            {{ t | float(0) if t not in ['unknown', 'unavailable', ''] else 0 }}
      - service: script.smart_charge_evaluate_now

  - id: smart_charge_hold_at_target
    alias: Smart charge stop at target → standby
    description: >-
      When SOC reaches the overnight target during the cheap window, stop force-charge
      and go standby (grid only) until SOC leaves the hysteresis band.
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: sensor.smart_charge_battery_soc
        above: input_number.smart_charge_locked_target_soc
    condition:
      - condition: state
        entity_id: input_boolean.smart_charge_enabled
        state: "on"
      - condition: time
        after: "00:30:00"
        before: "05:30:00"
      - condition: state
        entity_id: input_boolean.smart_charge_session_active
        state: "on"
      - condition: template
        value_template: >-
          {% set soc = states('sensor.smart_charge_battery_soc') | float(0) %}
          {% set target = states('input_number.smart_charge_locked_target_soc') | float(0) %}
          {{ soc <= (target + 2) }}
    action:
      - service: script.smart_charge_command_standby
      - service: script.smart_charge_set_status
        data:
          status: holding
          reason: >-
            Reached target {{ states('input_number.smart_charge_locked_target_soc') | int }}%
            — standby (grid); ESS above {{ (states('input_number.smart_charge_locked_target_soc') | float(0) + 2) | int }}%,
            charge below {{ states('input_number.smart_charge_locked_target_soc') | int }}%

  - id: smart_charge_ess_above_band
    alias: Smart charge ESS above target+hyst
    description: >-
      When SOC rises above locked target + 2% during the cheap window, enable full ESS.
    mode: single
    trigger:
      - platform: template
        value_template: >-
          {% set soc = states('sensor.smart_charge_battery_soc') | float(0) %}
          {% set target = states('input_number.smart_charge_locked_target_soc') | float(0) %}
          {{ soc > (target + 2) }}
    condition:
      - condition: state
        entity_id: input_boolean.smart_charge_enabled
        state: "on"
      - condition: time
        after: "00:30:00"
        before: "05:30:00"
      - condition: template
        value_template: >-
          {{ states('input_text.smart_charge_status') in ['charging', 'holding'] }}
    action:
      - service: script.smart_charge_restore_full_ess
      - service: script.smart_charge_set_status
        data:
          status: ess
          reason: >-
            SOC {{ states('sensor.smart_charge_battery_soc') }}% > target
            {{ states('input_number.smart_charge_locked_target_soc') | int }}% + 2 — ESS on

  - id: smart_charge_resume_if_soc_drops
    alias: Smart charge resume if SOC drops
    description: >-
      Resume force-charge when SOC falls below the locked target while holding standby or ESS
      in the cheap window.
    mode: single
    trigger:
      - platform: template
        value_template: >-
          {% set soc = states('sensor.smart_charge_battery_soc') | float(100) %}
          {% set target = states('input_number.smart_charge_locked_target_soc') | float(0) %}
          {{ soc < target }}
    condition:
      - condition: state
        entity_id: input_boolean.smart_charge_enabled
        state: "on"
      - condition: time
        after: "00:30:00"
        before: "05:30:00"
      - condition: template
        value_template: >-
          {{ states('input_text.smart_charge_status') in ['ess', 'holding', 'idle'] }}
    action:
      - delay: "00:00:05"
      - service: script.smart_charge_evaluate_now

  - id: smart_charge_enable_in_window
    alias: Smart charge enable during cheap window
    description: If automation is turned on inside the cheap window, evaluate immediately.
    mode: single
    trigger:
      - platform: state
        entity_id: input_boolean.smart_charge_enabled
        to: "on"
    condition:
      - condition: time
        after: "00:30:00"
        before: "05:30:00"
    action:
      - service: script.smart_charge_evaluate_now

  - id: smart_charge_cheap_window_end
    alias: Smart charge cheap window end
    description: At 05:30 restore full bidirectional ESS for the rest of the day.
    mode: single
    trigger:
      - platform: time
        at: "05:30:00"
    condition:
      - condition: state
        entity_id: input_boolean.smart_charge_enabled
        state: "on"
    action:
      - service: script.smart_charge_restore_full_ess
      - service: script.smart_charge_set_status
        data:
          status: idle
          reason: "Cheap window ended — full ESS restored"

  - id: smart_charge_daytime_ess
    alias: Smart charge daytime ESS mode
    description: Outside the cheap window, keep full bidirectional ESS when automation is on.
    mode: single
    trigger:
      - platform: state
        entity_id: input_boolean.smart_charge_enabled
        to: "on"
      - platform: homeassistant
        event: start
    condition:
      - condition: state
        entity_id: input_boolean.smart_charge_enabled
        state: "on"
      - condition: or
        conditions:
          - condition: time
            before: "00:30:00"
          - condition: time
            after: "05:30:00"
    action:
      - delay: "00:00:30"
      - service: script.smart_charge_restore_full_ess
      - service: script.smart_charge_set_status
        data:
          status: idle
          reason: "Automation on outside cheap window — full ESS active"

  - id: smart_charge_ha_start_recovery
    alias: Smart charge HA start recovery
    description: If HA restarts inside the cheap window, re-evaluate safely.
    mode: single
    trigger:
      - platform: homeassistant
        event: start
    condition:
      - condition: state
        entity_id: input_boolean.smart_charge_enabled
        state: "on"
      - condition: time
        after: "00:30:00"
        before: "05:30:00"
    action:
      - delay: "00:00:30"
      - service: script.smart_charge_evaluate_now

  - id: smart_charge_soc_unavailable_guard
    alias: Smart charge SOC unavailable guard
    description: Never keep charging if SOC goes unavailable mid-session.
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.smart_charge_battery_soc
        to:
          - unavailable
          - unknown
    condition:
      - condition: state
        entity_id: input_boolean.smart_charge_session_active
        state: "on"
    action:
      - service: script.smart_charge_command_standby
      - service: script.smart_charge_set_status
        data:
          status: error
          reason: "SOC became unavailable — forced standby"

  - id: smart_charge_learn_forecast_bias
    alias: Smart charge learn forecast bias
    description: Compare today's solar yield vs morning forecast; nudge correction factor.
    mode: single
    trigger:
      - platform: time
        at: "23:55:00"
    action:
      - variables:
          predicted: "{{ states('input_number.smart_charge_saved_day_forecast') | float(0) }}"
          actual: "{{ states('sensor.opendtu_60d84c_yield_day') | float(0) }}"
          old: "{{ states('input_number.smart_charge_forecast_correction') | float(1) }}"
          ratio: "{{ (actual / predicted) if predicted > 0.5 and actual > 0.5 else 1 }}"
          blended: "{{ [[0.5, (0.8 * old + 0.2 * ratio)] | max, 1.5] | min | round(2) }}"
      - condition: template
        value_template: "{{ predicted > 0.5 and actual > 0.5 }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.smart_charge_forecast_correction
        data:
          value: "{{ blended }}"